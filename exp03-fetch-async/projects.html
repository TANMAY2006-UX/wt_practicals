<!DOCTYPE html>
<html>
<head>
  <title>My Projects</title>
</head>
<body>
  <h1>My Projects</h1>
  <div id="projects"></div>

  <script>
    async function loadProjects() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=5");
        if (!response.ok) throw new Error("Request failed");
        const projects = await response.json();

        const output = projects.map(project => `
          <div>
            <h3>${project.title}</h3>
            <p>${project.body}</p>
          </div>
        `).join("");

        document.getElementById("projects").innerHTML = output;
      } catch (error) {
        document.getElementById("projects").textContent = "Unable to load projects.";
      }
    }

    loadProjects();
  </script>
</body>
</html>
